name: jxmusic
description: "JXMusic - 聚合音乐播放器（QQ音乐/网易云/酷狗/本地音乐）"
publish_to: 'none'
version: 0.11.0+46

environment:
  sdk: ">=3.13.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 网络
  dio: ^5.7.0
  # 状态管理
  flutter_riverpod: ^2.6.1
  # 播放引擎（libmpv，Windows/Android 双端）
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # 工具
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  # Windows 窗口管理
  window_manager: ^0.4.3
  # 权限（Android）
  permission_handler: ^11.3.1
  # 音频元数据读取
  audio_metadata_reader: ^1.8.1
  # 本地加密格式解码（NCM/QMC，MIT，源码 vendored 在 packages/music_decoder）
  music_decoder:
    path: packages/music_decoder
  # 加密（网易云 weapi 签名）
  pointycastle: ^3.9.1
  # 二维码（扫码登录本地渲染）
  qr_flutter: ^4.1.0
  tray_manager: ^0.8.3
  # ---- OpenHarmony（鸿蒙）平台适配 ----
  # path_provider 鸿蒙实现（纯 Dart FFI，vendored 自 CPF-Flutter/flutter_packages）
  path_provider_ohos:
    path: packages/path_provider_ohos
  # media_kit 鸿蒙原生 libmpv 库（仅 ohos 平台注册）
  media_kit_libs_ohos_video:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_flutter_media_kit.git
      path: libs/ohos/media_kit_libs_ohos_video
      ref: main

# media_kit 主包切换到 CPF-Flutter 鸿蒙适配版（增加 ohos 平台注册）
dependency_overrides:
  media_kit:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_flutter_media_kit.git
      path: media_kit
      ref: main
  media_kit_video:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_flutter_media_kit.git
      path: media_kit_video
      ref: main
  # cnativeapi（tray_manager 传递依赖）hook 不支持 OpenHarmony 工具链，
  # 本地副本跳过 OHOS 构建，其余平台行为不变
  cnativeapi:
    path: packages/cnativeapi
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
    # 酷狗 KGM/KGMA/VPR 解密公钥表（8MB，覆盖 128MB 音频）
    - assets/kugou_key.bin
